name: my_flutter_app

description: Frontend for the digital bookstore application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  dio: ^5.4.0
  permission_handler: ^11.3.0
  file_picker: ^8.0.0+1
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/en.json
    - assets/l10n/vi.json
